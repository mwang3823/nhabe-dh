<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhà Bè 2027–2030</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="perf.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="bg-ring"></div>
  <div class="bg-ring r2"></div>
  <div class="bg-wave">
    <svg class="wv w1" viewBox="0 0 3200 200" preserveAspectRatio="none"><path d="M0 110 C200 60 400 60 600 110 S1000 160 1200 110 S1400 60 1600 110 S2000 160 2200 110 S2400 60 2600 110 S3000 160 3200 110 V200 H0Z"/></svg>
    <svg class="wv w2" viewBox="0 0 3200 200" preserveAspectRatio="none"><path d="M0 130 C260 90 540 90 800 130 S1340 170 1600 130 S2140 90 2400 130 S2940 170 3200 130 V200 H0Z"/></svg>
  </div>
  <canvas id="fx"></canvas>
</div>

<main id="deck"></main>

<div class="prog" aria-hidden="true"><i></i></div>
<nav class="dots" id="dots" aria-label="Danh sách cảnh"></nav>
<div class="hud">
  <span class="hud-name" id="hudName"></span>
  <span class="hud-count" id="hudCount"></span>
  <button id="btnPrev" title="Lùi (←)" aria-label="Lùi"></button>
  <button id="btnNext" title="Tiếp (→)" aria-label="Tiếp"></button>
  <button id="btnNotes" title="Ghi chú thuyết trình (N)" aria-label="Ghi chú"></button>
  <button id="btnFull" title="Toàn màn hình (F)" aria-label="Toàn màn hình"></button>
</div>
<aside class="notes" id="notes" hidden></aside>

<script src="assets/icons.js"></script>
<script src="assets/notes.js"></script>
<script src="scenes.js"></script>
<script src="deck.js"></script>
<script src="fx.js"></script>
</body>
</html>
